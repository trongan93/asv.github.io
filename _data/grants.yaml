# Funded programs — 國科會 / NSTC, 教育部 / MOE, and others.
#
# Rendered by projects/index.md. Previously this lived as a raw markdown table
# inside that page, which overflowed badly on phones and could not be counted
# or sorted.
#
# PROVENANCE
# NSTC entries reconciled against the public researcher profile (Academic R&D
# Service, Researcher Query -> 計畫 tab) on 2026-08-15:
#   https://arspb.nstc.gov.tw/NSCWebFront/modules/talentSearch/talentSearch.do?action=initRsm17new&rsNo=692e939b0e8044b8bf92c0b2f35b8756&LANG=eng
# MOE entries come from the NTUT research export and the UAAT-TAMUS funding
# schedules. Working notes: _notes/nstc-project-reconciliation.md
#
# THREE RULES THIS FILE EXISTS TO PROTECT
#  1. Money is recorded at a stated LEVEL, and levels must never be conflated.
#     `amount` is the approved budget at the level this lab holds it, and
#     `amount-level` says which level that is — project-level for NSTC and the
#     TASA commission, subproject-level for UAAT-TAMUS, where NTUT's Subproject
#     3 allocation is the funding this lab holds as Co-PI. `programme-amount`
#     is the wider umbrella award and is NEVER summed into a site total.
#     `allocated` is the lab's own documented share within `amount`, and may be
#     set only where a formal budget document supports it.
#  2. A multi-year program appears here once per annual phase — "(1/4)",
#     "(2/4)", or one entry per academic year. Records are not programs. Never
#     count records as programs; group by `program` first. Pages that show a
#     count must say which of the two they are counting.
#
#     Each phase is funded separately and so CLOSES SEPARATELY: set a phase to
#     `completed` once its own term ends, even while the program continues
#     through a later phase. One program therefore shows completed and active
#     phases side by side — e.g. the CubeSat payload (1/4) is completed while
#     (2/4) runs, and the SAR fusion (1/3) is completed while (2/3) runs. Never
#     hold an ended phase open because its successor is still running, and
#     never close a program because one phase ended.
#
#     Every phase carries its own `grant-no`, which is what a reader uses to
#     tell the phases apart and verify each against the funder.
#  3. `category: teaching` entries are education grants, not research subsidies.
#     Teaching is different work from a research program, so these record the
#     ROLE ONLY — no `amount`, no `allocated`, no `kind`. They are listed in
#     their own section and excluded from every research total.
#
# The FY108 record on the NSTC profile (NT$25,000, graduate-student attendance
# at ICSSE 2019) is a conference travel grant, not a research project, and is
# deliberately absent from this file.
#
# Only AWARDED work is listed. As of the 2026-08-16 portal check one further
# application is 審查中 (under review) — FY115 低軌衛星通訊系統之安全防護與韌性強化
# (2/2), submitted 2025-07-24. Add it only once it is approved.
#
# year       ROC academic year, as reported by the funder (115 = 2026, 114 = 2025 …)
# ad-year    Gregorian equivalent, used for sorting and display
# period     optional; the actual execution period, as reported by the funder
# grant-no   optional; the funder's official project number (國科會計畫編號),
#            the canonical identifier for verifying an entry
# program    id shared by every annual phase of one program, see rule 2
# category   research  — NSTC and MOE research programs (default if unset)
#            industry  — government-commissioned industry-academia collaboration
#            teaching  — MOE education grants, see rule 3
#            research and industry are counted together as funded research and
#            share the theme grouping; teaching is kept wholly apart.
# agency     NSTC | MOE | TASA
# agency-full  optional; the funder's full bilingual name
# role       pi | co-pi
# status     active | completed  (site-maintained; funders do not report this)
# amount     approved subsidy in NT$ at `amount-level`, plain number so it can
#            be summed. Omitted where no figure at that level is documented.
# amount-level
#            project | subproject — what `amount` counts. NSTC publishes only a
#            project-level figure; for UAAT-TAMUS the documented figure is
#            NTUT's subproject allocation.
# programme-amount
#            optional; the umbrella programme award. Recorded for provenance,
#            NEVER summed and NOT rendered — for UAAT-TAMUS the award letter is
#            addressed to another institution.
# allocated  optional; the lab's own share, only with a budget document.
#            Recorded for provenance; not rendered on the cards.
# scheme     funding scheme / project category, as shown by the funder
# kind       research theme id, see _data/project-kinds.yaml (research only)
# title-full-en
#            optional; the full official English title, kept for verification
#            where `title-en` is shortened for display
# page       optional path to a project page on this site

