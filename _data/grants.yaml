# ---------------------------------------------------------------------------
# 產學合作 Industry–academia collaboration
#
# Government-commissioned space-technology collaboration. The NTUT research
# export categorises this as a government industry-academia project, which is
# a different funding type from an NSTC research subsidy or an MOE grant — so
# it carries `category: industry` and is labelled as such on the page.
#
# Per the source: describe as a Taiwan Space Agency-commissioned government
# industry-academia collaboration. Never as private-industry sponsorship,
# unless a company contract or company funding is supplied.
#
# NTUT record 10135 (申請類別 一般計畫, 計畫類型 政府產學計畫案), accounting
# no. 214I44, 受惠機構 臺北科技大學, 研發中心 前瞻通訊與遙測科技研究發展中心.
#
# NT$12,123,700 is the full commissioned award and the whole of it is NTUT's:
# 經常費 7,112,454 + 設備費 4,300,000 + 管理費 711,246 (10%) = 12,123,700.
# It is invoiced in instalments — NT$2,424,740 + NT$3,030,925 + NT$3,030,925
# issued to date, i.e. 20% + 25% + 25%, with 30% outstanding. An instalment
# schedule is not the award, so `amount` stays at the commissioned total.
#
# `allocated` is this lab's 主計系統 allocation, the figure NTUT's teacher
# research evaluation credits. PI 林信標 4,219,316 + four Co-PIs (陳志鏗
# 4,364,472, 莊嶸騰 1,000,000, 裴重恩 600,000, 蔡孟伸 1,939,912) = 12,123,700.
# ---------------------------------------------------------------------------

