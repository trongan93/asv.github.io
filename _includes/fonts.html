<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- latin fonts: url is generated automatically from the theme file -->
{% assign googlefonts = "_styles/-theme.scss" | file_read | google_fonts %}
<link href="{{ googlefonts }}" rel="stylesheet">

<!--
  CJK face for the site's Chinese copy. Linked by hand rather than via the
  theme file, because the auto-generated url always asks for italics and
  Noto Sans TC has no italic (which would 400 the whole request).
  Google serves this split by unicode-range, so browsers only fetch the
  subsets a page actually uses.
-->
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<!-- Font Awesome icons (load asynchronously due to size) -->
{% assign fontawesome = "https://use.fontawesome.com/releases/v6.5.0/css/all.css" %}
<link
  href="{{ fontawesome }}"
  rel="stylesheet"
  media="none"
  onload="this.removeAttribute('media'); this.onload = null;"
/>
<noscript>
  <link href="{{ fontawesome }}" rel="stylesheet">
</noscript>
